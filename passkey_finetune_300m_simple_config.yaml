general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: llama_300m_passkey_finetune_optimized
  run: 300m_passkey_optimized_memory_retrieval
  seed: 42
  step: null

# Infini-Attention Configuration
infini_attention:
  segment_length: 1024
  turn_on_memory: true
  balance_factor_lr: 0.01
  balance_act_type: hard_sigmoid
  balance_init_type: zeros
  logging: true
  logging_interval: 25
  log_grad: true
  log_segment_acts: true
  balance_factor_weight_decay: 0.0

# Model Configuration
model:
  ddp_bucket_cap_mb: 5  # Further reduced for memory optimization
  dtype: bfloat16
  init_method:
    std: 0.03125  # 1/sqrt(1024)
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 1
    eos_token_id: 2
    hidden_act: silu
    initializer_range: 0.02
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 12
    is_llama_config: true
    max_position_embeddings: 8192
    num_attention_heads: 8
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling: null
    tie_word_embeddings: false
    use_cache: true
    vocab_size: 49152

# Optimizer Configuration
optimizer:
  accumulate_grad_in_fp32: true
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  torch_adam_is_fused: false
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.00005
    lr_decay_starting_step: 15200
    lr_decay_steps: 15200
    lr_decay_style: cosine
    lr_warmup_steps: 100
    lr_warmup_style: linear
    min_decay_lr: 0.000005
  weight_decay: 0.02
  zero_stage: 0

# Parallelism Configuration
parallelism:
  dp: 4  # Data parallel across 4 GPUs
  tp: 1  # No tensor parallelism
  expert_parallel_size: 1
  pp: 1  # No pipeline parallelism
  pp_engine: 1f1b
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE

# Tokenizer Configuration
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: lvwerra/the-tokenizer-v1
  tokenizer_revision: null

# Training Tokens Configuration -
tokens:
  batch_accumulation_per_replica: 4
  limit_test_batches: 0
  limit_val_batches: 20
  micro_batch_size: 1
  sequence_length: 4096
  train_steps: 30400
  val_check_interval: 25

# Data Configuration - Use existing high-quality parquet files
data_stages:
  - name: "Passkey Finetune"
    start_training_step: 1
    data:
      dataset:
        hf_dataset_or_datasets: "parquet"
        hf_dataset_config_name: null
        hf_dataset_splits: "train"
        text_column_name: "prompt"
        dataset_processing_num_proc_per_process: 48
        dataset_overwrite_cache: false
        data_files: 
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00000-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00001-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00002-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00003-of-00004.parquet"
      num_loading_workers: 20
      seed: 42

# Checkpoints Configuration
checkpoints:
  checkpoint_interval: 25  # More frequent checkpoints for monitoring
  checkpoints_path: ./checkpoints/passkey_finetune_300m_optimized
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: ./checkpoints/fineweb_4gpu_300m_infini/30000  # Pre-trained base model
  save_initial_state: false

# Logging Configuration
logging:
  iteration_step_info_interval: 5
  log_level: info
  log_level_replica: info

# Profiler (disabled)
profiler: null


