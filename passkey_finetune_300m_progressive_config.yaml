general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: llama_300m_passkey_finetune_progressive
  run: 300m_passkey_progressive_memory_training
  seed: 42
  step: null

# Infini-Attention Configuration - Progressive Segment Length
infini_attention:
  segment_length: 64
  turn_on_memory: true
  balance_factor_lr: 0.01
  balance_act_type: hard_sigmoid
  balance_init_type: zeros
  logging: true
  logging_interval: 25
  log_grad: false
  log_segment_acts: true
  balance_factor_weight_decay: 0.0

# Model Configuration
model:
  ddp_bucket_cap_mb: 5
  dtype: bfloat16
  init_method:
    std: 0.03125
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 1
    eos_token_id: 2
    hidden_act: silu
    initializer_range: 0.02
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 12
    is_llama_config: true
    max_position_embeddings: 8192
    num_attention_heads: 8
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling: null
    tie_word_embeddings: false
    use_cache: true
    vocab_size: 49152

# Optimizer Configuration
optimizer:
  accumulate_grad_in_fp32: true
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  torch_adam_is_fused: false
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.00001
    lr_decay_starting_step: 3200
    lr_decay_steps: 800
    lr_decay_style: cosine
    lr_warmup_steps: 50
    lr_warmup_style: linear
    min_decay_lr: 0.000001
  weight_decay: 0.02
  zero_stage: 0

# Parallelism Configuration
parallelism:
  dp: 4
  tp: 1
  expert_parallel_size: 1
  pp: 1
  pp_engine: 1f1b
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE

# Tokenizer Configuration
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: lvwerra/the-tokenizer-v1
  tokenizer_revision: null

# Training Tokens Configuration
tokens:
  batch_accumulation_per_replica: 4
  limit_test_batches: 0
  limit_val_batches: 20
  micro_batch_size: 1
  sequence_length: 2048
  train_steps: 4000
  val_check_interval: 100

# Progressive Data Stages Configuration
data_stages:
  # Stage 1: Memory Activation
  - name: "Memory Activation Phase"
    start_training_step: 1
    data:
      dataset:
        hf_dataset_or_datasets: "parquet"
        hf_dataset_config_name: null
        hf_dataset_splits: "train"
        text_column_name: "prompt"
        dataset_processing_num_proc_per_process: 48
        dataset_overwrite_cache: false
        data_files:
          # Mixed dataset: 40% Passkey + 60% PG19
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00000-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00001-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00000-of-00023.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00001-of-00023.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00002-of-00023.parquet"
      num_loading_workers: 20
      seed: 42
    infini_attention:
      segment_length: 64
    tokens:
      sequence_length: 2048

  # Stage 2: Memory Training
  - name: "Memory Training Phase"
    start_training_step: 800
    data:
      dataset:
        hf_dataset_or_datasets: "parquet"
        hf_dataset_config_name: null
        hf_dataset_splits: "train"
        text_column_name: "prompt"
        dataset_processing_num_proc_per_process: 48
        dataset_overwrite_cache: false
        data_files:
          # Mixed dataset: 50% Passkey + 50% PG19
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00000-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00001-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00002-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00003-of-00023.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00004-of-00023.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00005-of-00023.parquet"
      num_loading_workers: 20
      seed: 42
    # Override for this stage
    infini_attention:
      segment_length: 128
    tokens:
      sequence_length: 4096

  # Stage 3: Memory Expansion
  - name: "Memory Expansion Phase"
    start_training_step: 1600
    data:
      dataset:
        hf_dataset_or_datasets: "parquet"
        hf_dataset_config_name: null
        hf_dataset_splits: "train"
        text_column_name: "prompt"
        dataset_processing_num_proc_per_process: 48
        dataset_overwrite_cache: false
        data_files:
          # Mixed dataset: 60% Passkey + 40% PG19
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00000-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00001-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00002-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00003-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00006-of-00023.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00007-of-00023.parquet"
      num_loading_workers: 20
      seed: 42
    # Override for this stage
    infini_attention:
      segment_length: 256
    tokens:
      sequence_length: 6144

  # Stage 4: Performance Optimization
  - name: "Performance Optimization Phase"
    start_training_step: 2400
    data:
      dataset:
        hf_dataset_or_datasets: "parquet"
        hf_dataset_config_name: null
        hf_dataset_splits: "train"
        text_column_name: "prompt"
        dataset_processing_num_proc_per_process: 48
        dataset_overwrite_cache: false
        data_files:
          # Mixed dataset: 70% Passkey + 30% PG19 (more task-focused)
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00000-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00001-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00002-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00003-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00008-of-00023.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00009-of-00023.parquet"
      num_loading_workers: 20
      seed: 42
    # Override for this stage
    infini_attention:
      segment_length: 512
    tokens:
      sequence_length: 8192

  # Stage 5: Full Performance
  - name: "Full Performance Phase"
    start_training_step: 3200
    data:
      dataset:
        hf_dataset_or_datasets: "parquet"
        hf_dataset_config_name: null
        hf_dataset_splits: "train"
        text_column_name: "prompt"
        dataset_processing_num_proc_per_process: 48
        dataset_overwrite_cache: false
        data_files:
          # Mixed dataset: 80% Passkey + 20% PG19 (high task focus)
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00000-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00001-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00002-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/train-00003-of-00004.parquet"
          - "/data1/infini-attn/infini-llama/nanotron-infini/finetuning/pg19/train-00010-of-00023.parquet"
      num_loading_workers: 20
      seed: 42
    # Override for this stage
    infini_attention:
      segment_length: 1024
    tokens:
      sequence_length: 12288

# Checkpoints Configuration
checkpoints:
  checkpoint_interval: 500
  checkpoints_path: ./checkpoints/passkey_finetune_300m_progressive
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: ./checkpoints/fineweb_4gpu_300m_infini/30000
  save_initial_state: false

# Logging Configuration
logging:
  iteration_step_info_interval: 50
  log_level: info
  log_level_replica: info

# Profiler - UNCHANGED
profiler: null